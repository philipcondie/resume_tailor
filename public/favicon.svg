<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Resume Tailor favicon: a document glyph with text lines, one accent
       line representing the "tailored" bullet. Slate to match the UI accent.
       Designed to stay legible at 16px. -->
  <rect width="32" height="32" rx="7" fill="#334155"/>
  <!-- the "page" -->
  <rect x="8" y="6" width="16" height="20" rx="2.5" fill="#ffffff"/>
  <!-- text lines -->
  <rect x="11" y="10" width="10" height="2" rx="1" fill="#94a3b8"/>
  <rect x="11" y="14" width="10" height="2" rx="1" fill="#94a3b8"/>
  <!-- the accent ("tailored") line -->
  <rect x="11" y="18" width="7" height="2" rx="1" fill="#0ea5e9"/>
  <rect x="11" y="22" width="10" height="2" rx="1" fill="#94a3b8"/>
</svg>
